workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

trivy:
  interruptible: true
  image:
    name: registry.sdlc.webcloud.ec.europa.eu/desi/desi/trivy:0.70.0
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: /cache/trivy
  cache:
    key: trivy-db
    paths:
      - /cache/trivy
  script:
    - trivy fs --ignore-unfixed --scanners vuln --format table --exit-code 1 .
  allow_failure: true


build-image-latest:
  interruptible: true
  stage: build
  image:
    name: registry.sdlc.webcloud.ec.europa.eu/desi/desi/buildkit:rootless
    entrypoint: [""]
  variables:
    HOME: /tmp
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - buildkitd --oci-worker-no-process-sandbox --addr unix:///tmp/buildkitd.sock > /tmp/buildkitd.log 2>&1 &
    - sleep 3
    - |
      buildctl --addr unix:///tmp/buildkitd.sock build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=docker \
        --opt filename=app.docker \
        --output type=image,name=$CI_REGISTRY_IMAGE/app:latest,push=true
    - |
      buildctl --addr unix:///tmp/buildkitd.sock build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=docker \
        --opt filename=nginx.docker \
        --output type=image,name=$CI_REGISTRY_IMAGE/nginx:latest,push=true
  after_script:
    - cat /tmp/buildkitd.log