workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

trivy:
  interruptible: true
  image:
    name: mirror.gcr.io/aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: /cache/trivy
  cache:
    key: trivy-db
    paths:
      - /cache/trivy
  script:
    - trivy fs --ignore-unfixed --scanners vuln --format table --exit-code 1 .
  allow_failure: true


build-image-latest:
  interruptible: true
  stage: build
  image:
    name: registry.gitlab.com/gitlab-ci-utils/container-images/kaniko:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/app.docker"
      --destination "${CI_REGISTRY_IMAGE}/app:latest"
      --registry-mirror "https://mirror.gcr.io/"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/nginx.docker"
      --destination "${CI_REGISTRY_IMAGE}/nginx:latest"
      --registry-mirror "https://mirror.gcr.io/"
