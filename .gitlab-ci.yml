workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - test
  - deploy-tag

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

backend-lint:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-alpine
  script:
    - uv sync
    - uv run ruff check
    - uv run ruff format --check


frontend-lint:
  stage: test
  image: mirror.gcr.io/library/node:24
  script:
    - cd frontend
    - npm ci
    - npm run lint:check


dependency-scan:
  interruptible: true
  stage: test
  image:
    name: ghcr.io/aquasecurity/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: /cache/trivy
  cache:
    key: trivy-db
    paths:
      - /cache/trivy
  script:
    - trivy fs --ignore-unfixed --scanners vuln --format table --exit-code 1 .
  allow_failure: true


build-and-deploy-latest:
  interruptible: true
  stage: test
  rules:
    # Run on pushes to the "main" branch
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  trigger:
    strategy: mirror
    include:
      - local: ".gitlab/deploy.yml"


build-and-deploy-tag:
  interruptible: true
  stage: deploy-tag
  rules:
    # Run on manual triggers on any tag.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG'
      when: manual
  trigger:
    strategy: mirror
    include:
      - local: ".gitlab/deploy.yml"
        inputs:
          tag: $CI_COMMIT_TAG
