workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

trivy:
  interruptible: true
  image:
    name: registry.sdlc.webcloud.ec.europa.eu/desi/desi/trivy:0.70.0
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: /cache/trivy
  cache:
    key: trivy-db
    paths:
      - /cache/trivy
  script:
    - trivy fs --ignore-unfixed --scanners vuln --format table --exit-code 1 .
  allow_failure: true


build-image-latest:
  interruptible: true
  image: registry.sdlc.webcloud.ec.europa.eu/desi/desi/docker:29.5.2-cli
  stage: build
  services:
    - name: registry.sdlc.webcloud.ec.europa.eu/desi/desi/docker:29.5.2-dind
      alias: docker
  rules:
    # Run on pushes to the "main" branch
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    # Run on manual triggers for the "main" branch.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - docker login --username gitlab-ci-token --password $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --tag $CI_REGISTRY_IMAGE/app:latest --file docker/app.docker .
    - docker build --tag $CI_REGISTRY_IMAGE/nginx:latest --file docker/nginx.docker .
    - docker push $CI_REGISTRY_IMAGE/app:latest
    - docker push $CI_REGISTRY_IMAGE/nginx:latest
